<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>측우기 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ead8;
    --fiber: #e9dcc2;
    --ink: #2a221b;
    --muted: #8a7a66;
    --line: #dccdb1;
    --seal: #b8322a;
    --seal-dark: #8e2219;
    --best: #2f6b4a;
    --worst: #b8322a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16181c;
      --fiber: #1d2026;
      --ink: #ece3d2;
      --muted: #9a917f;
      --line: #2e3138;
      --best: #8fd0a8;
      --worst: #ff8a7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Gowun Batang", "Batang", serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 30%, var(--fiber) 0, transparent 40%),
      radial-gradient(ellipse at 80% 70%, var(--fiber) 0, transparent 45%);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 15px; font-weight: 400; letter-spacing: 6px; color: var(--muted); margin: 0 0 10px; }
  .stage {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #7d878f;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    touch-action: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage .msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eef1f3; font-size: 15px; text-align: center; padding: 20px;
  }
  .readout {
    font-size: clamp(42px, 12vw, 54px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    margin: 14px 0 2px;
  }
  .sub { color: var(--muted); font-size: 14px; letter-spacing: 1px; text-align: center; }
  .controls { display: flex; gap: 12px; margin: 20px 0 22px; }
  button {
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 3px;
    min-width: 110px;
    padding: 11px 20px;
    border-radius: 4px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: default; }
  button.seal { background: var(--seal); border-color: var(--seal-dark); color: #fff6ea; }
  button.seal.running { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .record { width: 100%; max-width: 400px; }
  .record h2 {
    font-size: 15px; font-weight: 400; letter-spacing: 4px; color: var(--muted);
    border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin: 0;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
  ol { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  li .total { color: var(--muted); font-size: 14px; margin-left: 8px; }
  li .tag {
    font-size: 12px; margin-left: 6px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px;
  }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 18px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="app">
  <h1>測雨器</h1>
  <div class="stage" id="stage"><div class="msg" id="msg">측우기를 놓는 중…</div></div>
  <div class="readout" id="readout">00:00.00</div>
  <div class="sub">안에 세운 자(尺)가 잠긴 높이가 초 · 측우대 위 산가지가 분<br>화면을 끌어서 둘러볼 수 있습니다</div>
  <div class="controls">
    <button id="lapBtn" disabled>기록</button>
    <button id="startBtn" class="seal">비 내림</button>
  </div>
  <div class="record">
    <h2>測雨 記錄</h2>
    <div class="empty" id="empty">아직 남긴 기록이 없습니다.</div>
    <ol id="laps"></ol>
  </div>
  <p class="hint">Space 시작/정지 · L 기록 · R 초기화</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  /* ---------- 스탑워치 ---------- */
  const readout = document.getElementById('readout');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');
  const empty = document.getElementById('empty');

  let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [], lapMarks = [];

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const s = Math.floor(totalCs / 100) % 60;
    const m = Math.floor(totalCs / 6000) % 60;
    const h = Math.floor(totalCs / 360000);
    const pad = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function now() {
    return running ? elapsed + performance.now() - startTime : elapsed;
  }

  function renderLaps() {
    lapList.innerHTML = '';
    empty.style.display = laps.length ? 'none' : 'block';
    const min = Math.min(...laps), max = Math.max(...laps);
    let total = 0;
    const rows = laps.map((d, i) => {
      total += d;
      const li = document.createElement('li');
      let tag = '';
      if (laps.length >= 3 && d === min) { li.className = 'best'; tag = '<span class="tag">最速</span>'; }
      if (laps.length >= 3 && d === max) { li.className = 'worst'; tag = '<span class="tag">最遲</span>'; }
      li.innerHTML = `<span>제 ${i + 1} 기록${tag}</span><span>${format(d)}<span class="total">${format(total)}</span></span>`;
      return li;
    });
    rows.reverse().forEach(li => lapList.appendChild(li));
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      startBtn.textContent = '비 내림';
      startBtn.classList.remove('running');
      lapBtn.textContent = '초기화';
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = '비 그침';
      startBtn.classList.add('running');
      lapBtn.textContent = '기록';
      lapBtn.disabled = false;
    }
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    lapMarks.push({ min: Math.floor(t / 60000), level: (t % 60000) / 60000 });
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0; lapStart = 0; laps = []; lapMarks = [];
    renderLaps();
    lapBtn.textContent = '기록';
    lapBtn.disabled = true;
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => (running ? lap() : reset()));
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  /* ---------- 3D 장면 ---------- */
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const rand = (a, b) => a + Math.random() * (b - a);

  // 치수 (1 = 약 15cm)
  const BASE_H = 0.15, PED_H = 2.0, PED_W = 2.3;
  const R_OUT = 0.5, R_IN = 0.46, CYL_H = 2.06, FLOOR_T = 0.06;
  const CYL_Y = PED_H, CYL_TOP = CYL_Y + CYL_H;
  const IN_BOTTOM = CYL_Y + FLOOR_T, IN_H = CYL_H - FLOOR_T, MAX_WATER = IN_H - 0.04;
  const CUT = 0.95;                          // 앞쪽 절개 반각 (rad)
  const PHI0 = CUT, PHI_LEN = Math.PI * 2 - CUT * 2;

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return [c, c.getContext('2d')];
  }

  function tex(c, repeatX = 1, repeatY = 1, color = true) {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
    t.anisotropy = 8;
    if (color) t.encoding = THREE.sRGBEncoding;
    return t;
  }

  function speckle(g, w, h, n, colors, rMin, rMax) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = colors[(Math.random() * colors.length) | 0];
      g.beginPath();
      g.arc(Math.random() * w, Math.random() * h, rand(rMin, rMax), 0, Math.PI * 2);
      g.fill();
    }
  }

  // 청동: 녹청 얼룩과 빗물 자국
  function bronzeTextures() {
    const [c, g] = canvas(1024, 512);
    g.fillStyle = '#7a5532';
    g.fillRect(0, 0, 1024, 512);
    speckle(g, 1024, 512, 2500, ['rgba(60,38,20,.10)', 'rgba(150,110,65,.10)', 'rgba(40,26,14,.12)'], 4, 26);
    speckle(g, 1024, 512, 160, ['rgba(70,120,100,.16)', 'rgba(90,140,115,.12)'], 10, 45);
    for (let i = 0; i < 260; i++) {
      const x = Math.random() * 1024;
      g.strokeStyle = `rgba(35,22,12,${rand(.05, .16)})`;
      g.lineWidth = rand(1, 3);
      g.beginPath(); g.moveTo(x, rand(0, 200)); g.lineTo(x + rand(-4, 4), rand(250, 512)); g.stroke();
    }
    const [rc, rg] = canvas(512, 256);
    rg.fillStyle = '#7a7a7a';
    rg.fillRect(0, 0, 512, 256);
    speckle(rg, 512, 256, 3000, ['rgba(40,40,40,.25)', 'rgba(200,200,200,.2)'], 1, 6);
    return { map: tex(c, 2, 1), rough: tex(rc, 2, 1, false) };
  }

  function graniteCanvas(w, h) {
    const [c, g] = canvas(w, h);
    g.fillStyle = '#8e8a83';
    g.fillRect(0, 0, w, h);
    speckle(g, w, h, w * h / 60, ['#6b6862', '#c9c5bd', '#8d8880', '#b7a99c', '#4c4a46'], .6, 2.2);
    speckle(g, w, h, 80, ['rgba(60,58,54,.08)', 'rgba(255,255,255,.06)'], 20, 70);
    return [c, g];
  }

  function pedestalFront() {
    const [c, g] = graniteCanvas(512, 512);
    g.font = '700 92px "Gowun Batang", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    ['測', '雨', '臺'].forEach((ch, i) => {
      const x = 256 + (i - 1) * 130, y = 140;
      g.fillStyle = 'rgba(255,255,255,.28)'; g.fillText(ch, x + 2, y + 3);
      g.fillStyle = 'rgba(38,34,30,.78)'; g.fillText(ch, x, y);
    });
    return tex(c);
  }

  // 젖은 박석 바닥
  function groundTexture() {
    const [c, g] = canvas(1024, 1024);
    g.fillStyle = '#3d3a36';
    g.fillRect(0, 0, 1024, 1024);
    let y = 0;
    while (y < 1024) {
      const rh = rand(90, 150);
      let x = -rand(0, 80);
      while (x < 1024) {
        const rw = rand(110, 220);
        const v = rand(58, 92) | 0;
        g.fillStyle = `rgb(${v},${v - 4},${v - 10})`;
        g.beginPath();
        g.roundRect ? g.roundRect(x + 4, y + 4, rw - 8, rh - 8, 10) : g.rect(x + 4, y + 4, rw - 8, rh - 8);
        g.fill();
        x += rw;
      }
      y += rh;
    }
    speckle(g, 1024, 1024, 9000, ['rgba(0,0,0,.08)', 'rgba(255,255,255,.05)'], .6, 2.5);
    return tex(c, 5, 5);
  }

  // 자(尺): 0~60초 눈금
  function rulerTexture() {
    const [c, g] = canvas(128, 2048);
    g.fillStyle = '#b48d55';
    g.fillRect(0, 0, 128, 2048);
    for (let i = 0; i < 40; i++) {
      g.strokeStyle = `rgba(90,60,30,${rand(.08, .2)})`;
      g.lineWidth = rand(1, 3);
      const x = rand(0, 128);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rand(-6, 6), 2048); g.stroke();
    }
    g.fillStyle = '#20160d';
    g.strokeStyle = '#20160d';
    g.font = '700 30px "Gowun Batang", serif';
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let s = 0; s <= 60; s++) {
      const y = 2048 - (s / 60) * (MAX_WATER / IN_H) * 2048;
      const len = s % 10 === 0 ? 64 : s % 5 === 0 ? 46 : 26;
      g.lineWidth = s % 5 === 0 ? 4 : 2;
      g.beginPath(); g.moveTo(0, y); g.lineTo(len, y); g.stroke();
      if (s % 10 === 0 && s > 0) g.fillText(s, 122, y + 2);
    }
    return tex(c);
  }

  function envTexture(renderer) {
    const [c, g] = canvas(512, 256);
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#e6ebef');
    gr.addColorStop(.48, '#9aa3aa');
    gr.addColorStop(.52, '#6c6862');
    gr.addColorStop(1, '#2c2925');
    g.fillStyle = gr;
    g.fillRect(0, 0, 512, 256);
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = pmrem.fromEquirectangular(t).texture;
    t.dispose(); pmrem.dispose();
    return env;
  }

  // 측우기 단면: 바닥판 + 바깥 마디 3개 + 안쪽 벽
  function cylinderProfile() {
    const B = 0.03;
    const band = y0 => [[R_OUT, y0 - .05], [R_OUT + B, y0 - .032], [R_OUT + B, y0 + .032], [R_OUT, y0 + .05]];
    return [
      [0, 0], [R_OUT + B, 0], [R_OUT + B, .07], [R_OUT, .1],
      ...band(CYL_H / 3), ...band(CYL_H * 2 / 3),
      [R_OUT, CYL_H - .1], [R_OUT + B, CYL_H - .07], [R_OUT + B, CYL_H],
      [R_IN, CYL_H], [R_IN, FLOOR_T], [0, FLOOR_T],
    ];
  }

  function init() {
    if (!window.THREE || !THREE.OrbitControls) { msg.textContent = '3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; return; }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    msg.remove();
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const skyDry = new THREE.Color('#8b949b'), skyWet = new THREE.Color('#5c656c');
    scene.background = skyDry.clone();
    scene.fog = new THREE.Fog(scene.background.clone(), 9, 24);
    scene.environment = envTexture(renderer);

    const camera = new THREE.PerspectiveCamera(36, 1, .1, 60);
    camera.position.set(0, 4.7, 5.6);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.8, 0);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.minDistance = 3.5;
    controls.maxDistance = 10;
    controls.minAzimuthAngle = -.85;
    controls.maxAzimuthAngle = .85;
    controls.minPolarAngle = .75;
    controls.maxPolarAngle = 1.5;

    const hemi = new THREE.HemisphereLight(0xe2e8ec, 0x4a4036, .55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff6ea, 1.5);
    sun.position.set(-3.5, 8, 4.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 1, far: 20 });
    sun.shadow.bias = -.0004;
    sun.shadow.normalBias = .02;
    scene.add(sun);

    // 바닥
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: .32, metalness: 0, envMapIntensity: .8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 측우대
    const [gc] = graniteCanvas(512, 512);
    const graniteMat = new THREE.MeshStandardMaterial({ map: tex(gc), roughness: .62, envMapIntensity: .6 });
    const frontMat = new THREE.MeshStandardMaterial({ map: pedestalFront(), roughness: .62, envMapIntensity: .6 });
    const base = new THREE.Mesh(new THREE.BoxGeometry(PED_W + .3, BASE_H, PED_W + .3), graniteMat);
    base.position.y = BASE_H / 2;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(PED_W, PED_H - BASE_H, PED_W),
      [graniteMat, graniteMat, graniteMat, graniteMat, frontMat, graniteMat]
    );
    block.position.y = BASE_H + (PED_H - BASE_H) / 2;
    for (const m of [base, block]) { m.castShadow = m.receiveShadow = true; scene.add(m); }

    // 측우기 (앞쪽을 잘라낸 단면 모형)
    const bz = bronzeTextures();
    const bronzeMat = new THREE.MeshStandardMaterial({
      map: bz.map, roughnessMap: bz.rough, bumpMap: bz.rough, bumpScale: .012,
      metalness: .85, roughness: .55, side: THREE.DoubleSide,
    });
    const prof = cylinderProfile();
    const lathe = new THREE.Mesh(
      new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 128, PHI0, PHI_LEN),
      bronzeMat
    );
    lathe.position.y = CYL_Y;
    lathe.castShadow = lathe.receiveShadow = true;
    scene.add(lathe);

    const shape = new THREE.Shape();
    prof.forEach(([r, y], i) => (i ? shape.lineTo(r, y) : shape.moveTo(r, y)));
    const cutMat = new THREE.MeshStandardMaterial({ color: 0x9a6b3c, metalness: .9, roughness: .3, side: THREE.DoubleSide });
    for (const phi of [PHI0, PHI0 + PHI_LEN]) {
      const face = new THREE.Mesh(new THREE.ShapeGeometry(shape), cutMat);
      face.position.y = CYL_Y;
      face.rotation.y = phi - Math.PI / 2;
      face.castShadow = true;
      scene.add(face);
    }

    // 안에 세운 자
    const rulerMat = new THREE.MeshStandardMaterial({ map: rulerTexture(), roughness: .7 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x9a7444, roughness: .7 });
    const ruler = new THREE.Mesh(new THREE.BoxGeometry(.1, IN_H, .014), [woodMat, woodMat, woodMat, woodMat, rulerMat, woodMat]);
    ruler.position.set(0, IN_BOTTOM + IN_H / 2, -.437);
    scene.add(ruler);

    const markMat = new THREE.MeshStandardMaterial({ color: 0xc0281e, roughness: .5 });
    const marks = Array.from({ length: 12 }, () => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(.13, .012, .006), markMat);
      m.position.set(0, 0, -.428);
      m.visible = false;
      scene.add(m);
      return m;
    });

    // 물
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x1f4a63, roughness: .03, metalness: 0, transparent: true, opacity: .5,
      side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.2,
    });
    const WR = R_IN - .003;
    const waterWall = new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, 1, 128, 1, true, PHI0, PHI_LEN), waterMat);
    const waterCuts = [PHI0, PHI0 + PHI_LEN].map(phi => {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), waterMat);
      p.rotation.y = phi - Math.PI / 2;
      p.userData.phi = phi;
      return p;
    });
    scene.add(waterWall, ...waterCuts);

    // 수면: 극좌표 격자, 파문으로 출렁임
    const NR = 22, NP = 96;
    const surfGeo = new THREE.BufferGeometry();
    const surfPos = new Float32Array((NR + 1) * (NP + 1) * 3);
    const idx = [];
    for (let i = 0; i <= NR; i++) {
      for (let j = 0; j <= NP; j++) {
        const r = WR * i / NR, phi = PHI0 + PHI_LEN * j / NP, k = (i * (NP + 1) + j) * 3;
        surfPos[k] = r * Math.sin(phi);
        surfPos[k + 2] = r * Math.cos(phi);
        if (i < NR && j < NP) {
          const a = i * (NP + 1) + j, b = a + NP + 1;
          idx.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }
    }
    surfGeo.setAttribute('position', new THREE.BufferAttribute(surfPos, 3));
    surfGeo.setIndex(idx);
    const surfMat = waterMat.clone();
    surfMat.opacity = .7;
    const surface = new THREE.Mesh(surfGeo, surfMat);
    scene.add(surface);

    // 산가지 (분)
    const rodMat = new THREE.MeshStandardMaterial({ color: 0xc9a466, roughness: .55 });
    const rodGeo = new THREE.CylinderGeometry(.016, .016, .42, 10);
    const rods = Array.from({ length: 20 }, (_, i) => {
      const g = Math.floor(i / 5), k = i % 5;
      const gx = g < 2 ? -1.02 + g * .34 : .6 + (g - 2) * .34;
      const rod = new THREE.Mesh(rodGeo, rodMat);
      if (k < 4) {
        rod.rotation.x = Math.PI / 2;
        rod.position.set(gx + k * .06, PED_H + .016, .82);
      } else {
        rod.rotation.set(Math.PI / 2, 0, 1.05);
        rod.position.set(gx + .09, PED_H + .05, .82);
      }
      rod.castShadow = true;
      rod.visible = false;
      scene.add(rod);
      return rod;
    });

    // 빗줄기
    const N = 1400;
    const dropPos = new Float32Array(N * 6);
    const drops = Array.from({ length: N }, () => ({ x: 0, y: -999, z: 0, v: 0, on: false }));
    const rainGeo = new THREE.BufferGeometry();
    rainGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
    const rainMat = new THREE.LineBasicMaterial({ color: 0xdfe6eb, transparent: true, opacity: .42 });
    const rain = new THREE.LineSegments(rainGeo, rainMat);
    rain.frustumCulled = false;
    scene.add(rain);

    // 물보라
    const NS = 900;
    const spPos = new Float32Array(NS * 3);
    const sparks = Array.from({ length: NS }, () => ({ x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, life: 0 }));
    const spGeo = new THREE.BufferGeometry();
    spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    const spray = new THREE.Points(spGeo, new THREE.PointsMaterial({ color: 0xe8eef2, size: .028, transparent: true, opacity: .75 }));
    spray.frustumCulled = false;
    scene.add(spray);

    let spawnAcc = 0, dropCursor = 0, sparkCursor = 0, wet = 0, shownLevel = 0, waveAmp = 0, clock = 0;
    const ripples = [];

    function splash(x, y, z, n) {
      for (let i = 0; i < n; i++) {
        const s = sparks[sparkCursor];
        sparkCursor = (sparkCursor + 1) % NS;
        Object.assign(s, { x, y, z, vx: rand(-.5, .5), vy: rand(.6, 1.4), vz: rand(-.5, .5), life: rand(.18, .35) });
      }
    }

    function resize() {
      const w = stage.clientWidth, h = Math.min(Math.round(w * 1.12), 640);
      stage.style.height = h + 'px';
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    let last = performance.now();
    function frame(ts) {
      const dt = Math.min((ts - last) / 1000, .1);
      last = ts;
      clock += dt;
      const t = now();
      readout.textContent = format(t);

      // 하늘이 흐려지고 개는 정도
      wet += ((running ? 1 : 0) - wet) * Math.min(dt * 1.5, 1);
      scene.background.copy(skyDry).lerp(skyWet, wet);
      scene.fog.color.copy(scene.background);
      sun.intensity = 1.5 - wet * .75;
      hemi.intensity = .55 - wet * .1;
      rainMat.opacity = .42 * Math.max(wet, .001);

      // 수위
      const target = (t % 60000) / 60000;
      if (target < shownLevel - .3) shownLevel = Math.max(target, shownLevel - dt * 1.6);
      else shownLevel = target;
      const h = Math.max(shownLevel * MAX_WATER, .002);
      const top = IN_BOTTOM + h;
      const hasWater = shownLevel > .002;
      waterWall.visible = surface.visible = hasWater;
      waterWall.scale.y = h;
      waterWall.position.y = IN_BOTTOM + h / 2;
      for (const p of waterCuts) {
        p.visible = hasWater;
        p.scale.set(WR, h, 1);
        p.position.set(Math.sin(p.userData.phi) * WR / 2, IN_BOTTOM + h / 2, Math.cos(p.userData.phi) * WR / 2);
      }
      surface.position.y = top;

      // 비 생성
      if (running) {
        spawnAcc += dt * 650;
        while (spawnAcc >= 1) {
          spawnAcc--;
          const d = drops[dropCursor];
          dropCursor = (dropCursor + 1) % N;
          if (Math.random() < .12) {
            const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * R_IN * .92;
            d.x = Math.cos(a) * r; d.z = Math.sin(a) * r;
          } else {
            d.x = rand(-4, 4); d.z = rand(-4, 3);
          }
          d.y = rand(6.5, 8.5);
          d.v = rand(7, 8.5);
          d.on = true;
        }
      }

      // 비 이동·충돌
      for (let i = 0; i < N; i++) {
        const d = drops[i], k = i * 6;
        if (d.on) {
          d.y -= d.v * dt;
          const r = Math.hypot(d.x, d.z);
          let hitY = null, inWater = false;
          if (r < R_IN && d.y < CYL_TOP) {
            if (d.y <= top) { hitY = top; inWater = hasWater; }
          } else if (r < R_OUT + .04 && d.y <= CYL_TOP) {
            hitY = CYL_TOP;
          } else if (Math.abs(d.x) < PED_W / 2 && Math.abs(d.z) < PED_W / 2 && d.y <= PED_H) {
            hitY = PED_H;
          } else if (d.y <= 0) {
            hitY = 0;
          }
          if (hitY !== null) {
            d.on = false;
            if (inWater) {
              ripples.push({ x: d.x, z: d.z, age: 0 });
              if (ripples.length > 28) ripples.shift();
              waveAmp = Math.min(waveAmp + .25, 1.5);
              splash(d.x, hitY, d.z, 3);
            } else if (Math.random() < .5) {
              splash(d.x, hitY, d.z, 2);
            }
          }
        }
        if (d.on) {
          const len = d.v * .028;
          dropPos[k] = d.x; dropPos[k + 1] = d.y + len; dropPos[k + 2] = d.z;
          dropPos[k + 3] = d.x; dropPos[k + 4] = d.y; dropPos[k + 5] = d.z;
        } else {
          dropPos[k + 1] = dropPos[k + 4] = -999;
        }
      }
      rainGeo.attributes.position.needsUpdate = true;

      for (let i = 0; i < NS; i++) {
        const s = sparks[i], k = i * 3;
        if (s.life > 0) {
          s.life -= dt;
          s.vy -= 5 * dt;
          s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
          spPos[k] = s.x; spPos[k + 1] = s.y; spPos[k + 2] = s.z;
        } else {
          spPos[k + 1] = -999;
        }
      }
      spGeo.attributes.position.needsUpdate = true;

      // 수면 파문
      waveAmp = Math.max(waveAmp - dt * .8, running ? .25 : 0);
      for (const r of ripples) r.age += dt;
      while (ripples.length && ripples[0].age > 2.2) ripples.shift();
      if (hasWater) {
        for (let v = 0; v < surfPos.length; v += 3) {
          const x = surfPos[v], z = surfPos[v + 2];
          let y = waveAmp * .004 * Math.sin(x * 13 + clock * 3.1) * Math.sin(z * 11 - clock * 2.4);
          for (const r of ripples) {
            const d = Math.hypot(x - r.x, z - r.z) - r.age * .3;
            y += .011 * Math.exp(-r.age * 2.2) * Math.exp(-d * d / .004) * Math.cos(d * 55);
          }
          surfPos[v + 1] = y;
        }
        surfGeo.attributes.position.needsUpdate = true;
        surfGeo.computeVertexNormals();
      }

      // 산가지와 기록 표시
      const minutes = Math.floor(t / 60000);
      rods.forEach((rod, i) => (rod.visible = i < minutes));
      const cur = lapMarks.filter(m => m.min === minutes).slice(-marks.length);
      marks.forEach((m, i) => {
        m.visible = i < cur.length;
        if (m.visible) m.position.y = IN_BOTTOM + cur[i].level * MAX_WATER;
      });

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // 글꼴을 먼저 받아 와야 측우대 글씨와 자 눈금이 바로 그려짐
  Promise.race([
    document.fonts ? document.fonts.load('700 92px "Gowun Batang"') : Promise.resolve(),
    new Promise(r => setTimeout(r, 1500)),
  ]).then(init, init);
</script>
</body>
</html>
