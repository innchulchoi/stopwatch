<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --line: #e5e5ea;
    --start: #34c759;
    --stop: #ff3b30;
    --neutral: #d1d1d6;
    --best: #248a3d;
    --worst: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --line: #2c2c2e;
      --neutral: #3a3a3c;
      --best: #30d158;
      --worst: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .watch {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 24px;
    padding: 32px 24px 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
  }
  .display {
    text-align: center;
    font-size: clamp(48px, 15vw, 72px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    margin: 8px 0 28px;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }
  button {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    background: var(--neutral);
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .4; cursor: default; }
  button.start { background: var(--start); color: #fff; }
  button.stop { background: var(--stop); color: #fff; }
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
  }
  li {
    display: flex;
    justify-content: space-between;
    padding: 12px 4px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  li .total { color: var(--muted); font-size: 13px; margin-left: 8px; }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0 4px;
  }
  kbd {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <main class="watch">
    <div class="display" id="display">00:00.00</div>
    <div class="controls">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn" class="start">시작</button>
    </div>
    <ol id="laps"></ol>
    <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 초기화</p>
  </main>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() at last start
  let elapsed = 0;     // ms accumulated before last start
  let lapStart = 0;    // total elapsed at start of current lap
  let laps = [];       // lap durations in ms
  let rafId = null;

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const s = Math.floor(totalCs / 100) % 60;
    const m = Math.floor(totalCs / 6000) % 60;
    const h = Math.floor(totalCs / 360000);
    const pad = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function now() {
    return running ? elapsed + performance.now() - startTime : elapsed;
  }

  function tick() {
    display.textContent = format(now());
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const min = Math.min(...laps), max = Math.max(...laps);
    let total = 0;
    const rows = laps.map((d, i) => {
      total += d;
      const li = document.createElement('li');
      if (laps.length >= 3 && d === min) li.className = 'best';
      if (laps.length >= 3 && d === max) li.className = 'worst';
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${format(d)}<span class="total">${format(total)}</span></span>`;
      return li;
    });
    rows.reverse().forEach(li => lapList.appendChild(li));
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      display.textContent = format(elapsed);
      startBtn.textContent = '시작';
      startBtn.className = 'start';
      lapBtn.textContent = '초기화';
    } else {
      startTime = performance.now();
      running = true;
      tick();
      startBtn.textContent = '정지';
      startBtn.className = 'stop';
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    }
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lapStart = 0;
    laps = [];
    display.textContent = format(0);
    lapList.innerHTML = '';
    lapBtn.textContent = '랩';
    lapBtn.disabled = true;
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => (running ? lap() : reset()));

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });
</script>
</body>
</html>
